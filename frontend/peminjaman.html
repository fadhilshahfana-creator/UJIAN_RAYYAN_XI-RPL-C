<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Alat</title>
    <link rel="stylesheet" href="output.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <header
        class="bg-blue-600 text-white px-4 sm:px-5 py-3 sm:py-4 flex justify-between items-center gap-3 sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold">UKT</h1>
        </div>
    </header>

    <div class="flex flex-col md:flex-row min-h-[calc(100vh-72px)]">
        <aside id="sidebarMenu"
            class="hidden md:block w-full md:w-56 bg-white border-b-2 md:border-b-0 md:border-r-2 border-blue-800 flex-shrink-0">
            <nav class="block">
                <a href="kategori.html" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100">
                    DATA KATEGORI
                </a>
                <a href="alat.html" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100">
                    DATA ALAT
                </a>
                <a href="tambah_a.html" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100">
                    TAMBAH ALAT
                </a>
                <a href="peminjaman.html" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100">
                    PEMINJAMAN
                </a>
                <a href="tambah_p.html" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100">
                    TAMBAH PEMINJAMAN
                </a>
            </nav>
        </aside>

        <main class="flex-1 p-4 sm:p-6 min-w-0">

            <div
                class="bg-white border rounded-lg p-4 mb-5 shadow-md hover:-translate-y-1 hover:shadow-lg duration-300">
                <h2 id="judulHalaman" class="text-2xl sm:text-3xl font-bold">DATA PEMINJAMAN</h2>
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="border p-2">ID PEMINJAMAN</th>
                            <th class="border p-2">NAMA ALAT</th>
                            <th class="border p-2">NAMA PEMINJAM</th>
                            <th class="border p-2">KELAS</th>
                            <th class="border p-2">TANGGAL PINJAM</th>
                            <th class="border p-2">TANGGAL KEMBALI</th>
                            <th class="border p-2">JUMLAH</th>
                            <th class="border p-2">STATUS</th>
                            <th class="border p-2">AKSI</th>
                        </tr>
                    </thead>
                    <tbody id="peminjaman-list" class="divide-y divide-gray-100">
                        <tr>
                            <td colspan="9" class="py-4 px-6 text-center text-gray-500">Memuat data Peminjaman...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        <div id="modeEdit"
            style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
            <div style="background:white; padding:20px; border-radius:10px; width:500px;">
                <h3>EDIT PEMINJAMAN</h3><br>

                <input type="hidden" id="edit-id">

                <label class="block text-sm font-medium text-gray-700 mb-1">ALAT</label>
                <select id="edit-id_alat" class="w-full border border-gray-300 rounded-lgpx-4 py-2.5 text-sm bg-white">
                    <option value="" disabled selected>-- Memuat Alat... --</option>
                </select><br><br>

                <label>NAMA PEMINJAM</label>
                <input id="edit-nama" type="text" placeholder="Nama Peminjam"
                    style="background:white; padding:8px; border-radius:10px; width:455px; border:2px solid black;"><br>

                <label>KELAS</label>
                <input id="edit-kelas" type="text" placeholder="Kelas"
                    style="background:white; padding:8px; border-radius:10px; width:455px; border:2px solid black;"><br>

                <label>TANGGAL PINJAM</label>
                <input id="edit-tanggal-pinjam" type="date"
                    style="background:white; padding:8px; border-radius:10px; width:455px; border:2px solid black;"><br>

                <label>TANGGAL KEMBALI</label>
                <input id="edit-tanggal-kembali" type="date"
                    style="background:white; padding:8px; border-radius:10px; width:455px; border:2px solid black;"><br>

                <label>JUMLAH</label>
                <input id="edit-jumlah" type="number" placeholder="Jumlah"
                    style="background:white; padding:8px; border-radius:10px; width:455px; border:2px solid black;"><br>

                <label>STATUS</label>
                <select id="edit-status"
                    style="background:white; padding:8px; border-radius:10px; width:455px; border:2px solid black;">
                    <option value="Dipinjam">Dipinjam</option>
                    <option value="Dikembalikan">Dikembalikan</option>
                    <option value="Terlambat">Terlambat</option>
                </select><br>

                <button onclick="tutupEdit()"
                    style="background:#dc2626; color: white; margin-left: 315px; padding:8px 12px; border: none; border-radius: 5px; margin-top: 10px;">Batal</button>
                <button onclick="simpanEditPeminjaman()"
                    style="background:#2563eb; color:white; padding:8px 12px; border:none; border-radius:5px; margin-top: 10px;">Simpan</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
